<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">

<body>
    <!-- 登録画面リスト用ヘッダー -->
    <header th:fragment="regist-header-fragment">

        <!-- 検索ボックス -->
        <div class="search-box">
            <input id="search-box" type="search" placeholder="検索">
        </div>

        <!-- 新規作成ボタン -->
        <div class="img-btn pc-style" onclick="createFormDisplay(0)">
            <img title="作成・登録" src="/icons/add.png">
        </div>

        <!-- 削除ボタン -->
        <div class="img-btn pc-style" onclick="removeItemFromList('/tablelist/remove/multiple', this)">
            <img title="削除" src="/icons/dust.png">
        </div>

        <!-- ダウンロードボタン -->
        <div class="img-btn pc-style" onclick="downloadCsvFile('/tablelist/download/csv', this)">
            <img title="ダウンロード" src="/icons/download.png">
            <!-- <div id="download-menu-dialog-area"></div> -->
        </div>

        <!-- 更新ボタン -->
        <div class="img-btn pc-style" onclick="updateTableListDisplay()">
            <img title="更新" src="/icons/update.png">
        </div>

        <!-- ケバブメニュー -->
        <div class="sp-style">
            <div class="img-btn" onclick="createKebabRegistHeaderMenuDialog('tablelist')">
                <img title="メニュー" th:src="@{/icons/kebab_menu.png}">
            </div>
            <div id="kebab-menu-dialog-area"></div>
        </div>
    </header>

</body>

</html>
