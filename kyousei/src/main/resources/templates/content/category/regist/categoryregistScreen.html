<html xmlns:th="http://www.thymeleaf.org">

<body>

        <div layout:replace="~{fragment/breadcrumbFragment::title(${breadcrumbs})}"></div>
        <!-- ヘッダー -->
        <header th:replace="~{content/category/regist/categoryRegistHeaderFragment::regist-header-fragment}"></header>

</html>
