<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">

<body>
    <!-- 登録画面リスト用ヘッダー -->
    <header th:fragment="regist-header-fragment">
        <div class="recycleregist-inputs" name="recycle-input-area">            
            <div class="recycleregist-input">
                <div class="form-dialog-parts">
                    <label>引渡日</label>
                    <input name="recycle-deliverydate" class="normal-input" type="date" value="" onfocus="this.select();">
                </div>
                <div class="form-dialog-parts">
                    <label>お問合せ管理票番号</label>
                    <input name="recycle-number" class="normal-input" type="text" inputmode="numeric" pattern="\d*" maxlength="15" value="" onfocus="this.select();">
                    <div name="camera-btn" class="img-btn" onclick="execCamera(this)">
                        <img title="追加" src="/icons/camera.png">
                    </div>
                </div>
                <button name="add-btn" class="normal-btn ok" type="button" onclick="execAddRecycleRegist()">                        
                    <span>登録</span>
                </button>
                <div></div>

                <!-- 保存ボタン -->
                <!-- <button name="save-btn" class="normal-btn ok" type="button" onclick="execSaveRecycleRegist()">
                    <span>保存</span>
                </button> -->
                <!-- 削除ボタン -->
                <!-- <button name="delete-btn" class="normal-btn" type="button" onclick="execDeleteRecycleRegist()">
                    <span>削除</span>
                </button> -->
                <!-- リセットボタン -->
                <!-- <button name="reset-btn" class="normal-btn" type="button" onclick="execResetRecycleRegist()">
                    <span>リセット</span>
                </button> -->
            </div>
        </div>

    </header>

</body>

</html>
