<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div class="tablelist-container recycle" th:fragment="recycleregist-screen(breadcrumbs)">

        <!-- パンくずリスト -->
        <div layout:replace="~{fragment/breadcrumbFragment::title(${breadcrumbs})}"></div>
        <!-- ヘッダー -->
        <header th:replace="~{content/recycle/price/recyclePriceRegistHeaderFragment::regist-header-fragment}"></header>
        <!-- コンテンツ -->
        <!-- <div id="recyclepriceregist-area" name="recyclempriceregist-area" class="recycleregist-content"> -->
            <div class="recycleprice-input header pc-style">

                <label>品目</label>
                <label>税込</label>
                <label>税抜</label>
            </div>
            <main id="scroll-area" name="recyclepriceregist-area">

                    <label class="pc-style">エアコン</label>
                    <label class="sp-style">10 エアコン</label>
                    <input name="price" data-priceclass="price" data-pricecode="10" class="normal-input text-right"
                        onfocus="this.select();">
                    <input name="price" data-priceclass="ex_tax" data-pricecode="10" class="normal-input text-right"
                        onfocus="this.select();">
                </div>
                <div class="recycleprice-input">
                    <label class="pc-style">21</label>

                <div class="recycleprice-input">

                    <input name="price" data-priceclass="ex_tax" data-pricecode="31" class="normal-input text-right"

                <div class="recycleprice-input">

        <!-- </div> -->

        <button type="button" class="page-top"></button>
        <div id="loading">
            <div class="spinner"></div>
        </div>

</html>
