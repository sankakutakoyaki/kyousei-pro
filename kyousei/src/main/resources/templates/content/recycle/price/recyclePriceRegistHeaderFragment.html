        <div class="recycleregist-inputs" name="recycle-input-area">
            <div class="recycleregist-input">
                <div class="form-dialog-parts">
                    <label>コード</label>
                    <input name="maker-code" class="normal-input" type="text" inputmode="numeric" pattern="\d*" maxlength="3" value="" onfocus="this.select();">
                </div>
                <div name="search-btn" class="img-btn sp-style" onclick="getMakerNameOnSearch()">
                    <img title="検索" src="/icons/search.png">
                </div>
                <div class="form-dialog-parts">
                    <label>製造業者等名</label>
                    <input name="maker-name" class="normal-input" type="text" value="" disabled>
                </div>
                <div class="img-btns sp-style">
                    <!-- 保存ボタン -->
                    <div class="img-btn" onclick="execSaveRecycleRegist()">
                        <img title="保存" src="/icons/save.png"><span>保存</span>
                    </div>
                    <!-- リセットボタン -->
                    <div class="img-btn" onclick="execResetRecycleRegist()">
                        <img title="リセット" src="/icons/uturn.png"><span>リセット</span>
                    </div>
                </div>
                <!-- 保存ボタン -->
                <button name="save-btn" class="normal-btn ok pc-style" type="button" onclick="execSaveRecycleRegist()">
                    <span>保存</span>
                </button>
                <!-- リセットボタン -->
                <button name="reset-btn" class="normal-btn cancel pc-style" type="button" onclick="execResetRecycleRegist()">
                    <span>リセット</span>
                </button>

            </div>

        </div>
    </header>

</body>
