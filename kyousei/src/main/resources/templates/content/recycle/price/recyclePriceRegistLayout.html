            position: relative;

            display: grid;

            /* .recyclelist-inputs>.recyclelist-input:first-child {

            } */

                grid-column: 1 / span 2;
            }
            .recycleregist-input>.form-dialog-parts:nth-child(2) {
                grid-column: 2 / span 1;
            }
            .recycleregist-input>.form-dialog-parts:nth-child(3) {
                grid-column: 1 / span 6;
            }
            /* .recycleregist-input>button[name="save-btn"] {
                grid-column: 1 / span 3;
            }
            .recycleregist-input>button[name="reset-btn"] {

                display: flex;
                grid-column: 1 / 6;

            }
            .recycleregist-input>.img-btns>.img-btn {
                margin-right: 1rem;
                width: 3rem;
                /* display: grid;
                grid-template-columns: 3rem 1fr;
                align-items: center; */

                justify-items: center;
            }
            .recycleregist-input>.img-btns>.img-btn>span {
                font-size: 60%;
            }
            .recycleregist-input>div[name="search-btn"] {
                width: 3rem;
            }

                margin-left: 1rem;

<body>
    <div th:replace="~{fragment/main::main-fragment-nosidebar}"></div>

    <script th:src="@{/js/default.js}"></script>
    <script th:src="@{/js/dialog.js}"></script>
    <script th:src="@{/js/list.js}"></script>
    <script th:src="@{/js/recycle.js}"></script>
    <script type="text/JavaScript" th:inline="JavaScript">
        const updateStateCode = /*[[${updateStateCode}]]*/;
        const createStateCode = /*[[${createStateCode}]]*/;
        const deleteStateCode = /*[[${deleteStateCode}]]*/;
        const token = /*[[${_csrf.token}]]*/;
        let origin = [];
        let list = /*[[${list}]]*/;

// ----------------------------------------------------------------------------------------------------------------------------------

            // リセット処理
            function execResetRecycleRegist() {
                startProcessing();

                list = structuredClone(origin);
                RecycleMakerInputValueAllClear();

                const code = document.querySelector('[name="maker-code"]');
                if (code != null) code.focus();

                processingEnd();
            }

            // 入力ボックス初期化
            function RecycleMakerInputValueAllClear() {
                const code = document.querySelector('[name="maker-code"]');
                const name = document.querySelector('[name="maker-name"]');
                code.value = "";
                name.value = "";

                // const area = document.getElementById('recyclepriceregist-area');
                const area = document.querySelector('[name="recyclepriceregist-area"]');
                if (area == null) return;
                const pricelist = area.querySelectorAll('[name="price"]');
                if (pricelist == null) return;
                pricelist.forEach(function (price) {
                    price.value = "";
                });
            }

            // 保存時の処理
            async function execSaveRecycleRegist() {
                await execSaveRegistListAfterLoadingList("/recycle/price/save", "/list/recycle/price")
            }

            // 金額入力ボックスが変更されたら[list]に登録する
            function execPriceInpuChanged(e) {
                const codeElm = document.querySelector('[name="maker-code"]');
                if (codeElm == null || codeElm.value == "") return;
                const makerCode = Number(codeElm.value);
                const priceCode = Number(e.target.dataset.pricecode);
                const priceClass = e.target.dataset.priceclass;

                if (list.length > 0) {
                    const item = list.find(value => { return value.recycle_maker_code == makerCode && value.recycle_price_code == priceCode; });
                    if (item != null) {
                        switch (priceClass) {
                            case "price":
                                item.price = Number(e.target.value);
                                break;
                            case "ex_tax":
                                item.ex_tax = Number(e.target.value);
                                break;                        
                            default:
                                break;
                        }
                        if (item.recycle_price_id > 0) {
                            item.state = updateStateCode;
                        }                        
                        return;
                    }
                }

                const price = priceClass == "price" ? Number(e.target.value) : 0;
                const ex_tax = priceClass == "ex_tax" ? Number(e.target.value) : 0;

                const elm = { "recycle_price_id": 0, "recycle_price_code": priceCode, "recycle_maker_code": makerCode, "price": price, "ex_tax": ex_tax, "state": createStateCode};
                list.push(elm);
            }

            function getMakerNameOnEnter(e) {
                if(e.key === 'Enter'){
                    getMakerName(e.target.value);
                }
            }
            function getMakerNameOnSearch() {
                const elm = document.querySelector("[name='maker-code']");
                if (elm == null || elm.value == "") return;
                getMakerName(elm.value);
            }
            // メーカーコード入力時、メーカー情報・料金を取得して表示
            async function getMakerName(code) {
                // if(e.key === 'Enter'){
                    const data = "code=" + encodeURIComponent(code);
                    const url = '/recycle/maker/get';
                    const contentType = 'application/x-www-form-urlencoded';
                    const result = await postFetch(url, data, token, contentType);
                    const maker = await result.json();
                    if (maker != null) {                        
                        const name = document.querySelector('[name="maker-name"]');
                        name.value = maker.recycle_maker_name;
                    }

                    const items = list.filter(value => { return value.recycle_maker_code == code; });

                    if (items != null) {
                        const area = document.querySelector('[name="recyclepriceregist-area"]');
                        if (area == null) return;
                        const pricelist = area.querySelectorAll('[name="price"]');
                        if (pricelist == null) return;
                        pricelist.forEach(function (price) {
                            let item = items.find(value => { return value.recycle_price_code == Number(price.dataset.pricecode); });

                            if (item != null) {
                                switch(price.dataset.priceclass) {
                                    case "price":
                                        price.value = item.price;
                                        break;
                                    case "ex_tax":
                                        price.value = item.ex_tax;
                                        break;
                                    default:
                                        price.value = 0;
                                        break;
                                }
                            } else {
                                price.value = 0;
                            }
                        });
                    }
	            // }
            }

// 初期化時の処理 ------------------------------------------------------------------------------------------------------------------------------------
            // 読み込み時の処理
            window.addEventListener("load", () => {
                // コードボックスでエンターキーが押された時の処理を登録
                const codeElm = document.querySelector('[name="maker-code"]');
                if (codeElm != null){
                    document.querySelector('[name="maker-code"]').addEventListener('keydown', async function (e) { await getMakerNameOnEnter(e); });
                }

                // 金額入力ボックスの内容が変更された時の処理を登録
                document.querySelectorAll('[name="price"]').forEach(function(price){
                    price.addEventListener('change', function(e) {
                        e.preventDefault();
                        if ( this.value.length > 0 ) {
                            execPriceInpuChanged(e);
                        }
                    }, false);
                });

                // 編集用リストを初期化用リストにコピー
                origin = structuredClone(list);

                // 処理が終了したらスピナーを消去する
                processingEnd();
            });

            window.addEventListener('beforeunload', (e) => {
                const check = list.find(value => { return value.state != 0 });
                if (check != null) {
                    const message = '保存されていないデータがあります。ページを離れますか？';
                    e.preventDefault();
                    e.returnValue = message;
                    return message;
                }
            });
        </script>
    </div>
</body>

</html>
