<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">

<body>
    <!-- 登録画面リスト用ヘッダー -->
    <header th:fragment="regist-header-fragment">
        <div class="recycleregist-inputs" name="recycle-input-area">
            <div class="recycleregist-input">
                <div class="form-dialog-parts">
                    <label>小売業者等名</label>
                    <select name="recycle-company" class="normal-select" type="text" value="" onchange="createShipperOffice(this);"></select>
                </div>
                <div class="form-dialog-parts">
                    <label>支店名</label>
                    <select name="recycle-office" class="normal-select" type="text" value=""></select>
                </div>
                <div class="form-dialog-parts">
                    <label>使用日</label>
                    <input name="recycle-usedate" class="normal-input" type="date" value="" onfocus="this.select();">
                </div>
            </div>
            <div class="recycleregist-input">
                <div class="form-dialog-parts">
                    <label>お問合せ管理票番号</label>
                    <input name="recycle-number" class="normal-input" type="text" inputmode="numeric" pattern="\d*" maxlength="15" value="" onfocus="this.select();">
                </div>
                <div class="form-dialog-parts">
                    <label>品目</label>
                    <div class="multiple">
                        <input name="recycle-class-code" class="normal-input" type="text" inputmode="numeric" pattern="\d*" maxlength="2" value="" onfocus="this.select();">
                        <input name="recycle-class-name" class="normal-input" type="text" value="" disabled>
                    </div>                    
                </div>
                <div class="form-dialog-parts">
                    <div name="fixcomp">
                        <label>略称</label><input id="fixcomp" name="fixcomp-chk" type="checkbox" tabindex="-1"><label for="fixcomp">固定</label>
                    </div>
                    <div class="multiple">
                        <input name="recycle-maker-code" class="normal-input" type="text" inputmode="numeric" pattern="\d*" maxlength="3" value="" onfocus="this.select();">
                        <input name="recycle-maker-name" class="normal-input" type="text" value="" disabled>
                    </div>
                </div>
            </div>
            <div class="recycleregist-input">
                <div class="form-dialog-parts">
                    <label>税込金額</label>
                    <input name="recycle-price" class="normal-input" type="text" inputmode="numeric" pattern="\d*" value="" onfocus="this.select();">
                </div>
                <div class="form-dialog-parts">
                    <label>税抜金額</label>
                    <input name="recycle-ex-tax" class="normal-input" type="text" inputmode="numeric" pattern="\d*" value="" onfocus="this.select();">                
                </div>
                <button name="add-btn" class="normal-btn" type="button" onclick="execAddRecycleRegist()">                        
                        <span>追加</span>
                </button>

                <div></div>

                <!-- 保存ボタン -->
                <button name="save-btn" class="normal-btn ok" type="button" onclick="execSaveRecycleRegist()">
                    <span>保存</span>
                </button>
                <!-- 修正ボタン -->
                <button name="update-btn" class="normal-btn" type="button" onclick="execUpdateRecycleRegist()">
                    <span>修正</span>
                </button>
                <!-- 削除ボタン -->
                <button name="delete-btn" class="normal-btn" type="button" onclick="execDeleteRecycleRegist()">
                    <span>削除</span>
                </button>
                <!-- リセットボタン -->
                <button name="reset-btn" class="normal-btn" type="button" onclick="execResetRecycleRegist()">
                    <span>リセット</span>
                </button>
            </div>
        </div>

    </header>

</body>

</html>
