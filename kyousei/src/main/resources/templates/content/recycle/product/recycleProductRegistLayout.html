<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,viewport-fit=cover">

<head>
    <meta charset="UTF-8">
    <link th:href="@{/css/recycle.css}" rel="stylesheet" type="text/css">
    <style type="text/css">
        .tablelist-container.recycle {
            width: 40rem;
            /* justify-content: center; */
            grid-template-rows: auto auto auto 1fr;
        }
        /* .registlist-container {
            width: 45rem;
            padding: 0 2rem;
            justify-content: center;
            height: 100%;
            overflow: hidden;
        } */
        .registlist-content {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            justify-items: center;
            height: fit-content;
            /* height: 100%;
            overflow: hidden; */
        }
        .tablelist-container>header {
            display: grid;
            grid-template-columns: 1fr 3rem 20rem 5rem 5rem 1fr;
            gap: .5rem;
            /* height: 4rem; */
            align-items: center;
            margin-bottom: 1rem;
            padding: 0;
            background-color:beige ;
            border-radius: .5rem;
        }
        div[name="registlist-header"] {
            display: flex;
        }
        .registlist-area {
            /* height: 100%;
            overflow: hidden; */
            padding: 0 3rem;
        }
        .registlist-list {
            width: 100%;
            /* height: 100%;
            overflow: hidden; */
            padding: 0 3rem;
        }
        /* .registlist-content .scroll-area {
            height: 80%;
        } */
        .registlist-content .img-btns {
            display: flex;
            margin-left: 1rem;
        }
        .registlist-content .img-btn {
            /* margin-bottom: .5rem; */
            align-items: center;
        }
        .registlist-content .img-btn>img {
            padding: .2rem;
            width: 2rem;
        }
        .recycle-product-maker-input {
            display: grid;
            gap: .5rem;
            grid-template-columns: 5rem 1fr;
        }
        .recycle-product-maker-input>input {
            background-color: var(--white);
        }

        @media screen and (max-width:560px) {
            /* .registlist-container {
                width: 100%;
            } */
            .tablelist-container.recycle {
                min-width: 100%;
                max-width: 100%;
            }
            .recyclelist-inputs {
                padding: 0;
            }
            .recycle-product-maker-input {
                grid-template-columns: 5rem 3rem 1fr;
                gap: 0;
            }
            /* .recycleregist-header {
                grid-template-columns: 1fr 1fr;
                padding: 0;
                margin-bottom: 0;
                padding: 1rem;
            } */
            .recycleregist-header>.search-box {
                grid-column: 1 / span 2;
            }
            .tablelist-container header {
                padding: 0 1rem;
                grid-template-columns: 1fr 3rem;
                background-color: transparent;
                row-gap: 0;
                margin-bottom: 0;
            }
            .tablelist-container header>.header-label {
                grid-column: 1 / span 2;
                padding: 0;
                margin: 0;
            }
            .recycleregist-input {
                grid-template-columns: 1fr 1fr;
                row-gap: 0;
            }
            .recycleregist-input>.form-dialog-parts:nth-child(3) {
                grid-column: 1 / span 2;
            }
            .breadcrumb {
                margin-left: 1rem;
            }
            .registlist-list {
                padding: 0 1rem;
            }
            div[name="registlist-header"] {
                display: block;
            }
            .tablelist-container>main {
                border-top: 3px solid var(--line);
            }
            .recycleregist-content .normal-list ul {
                width: 100vw;
            }
            .recycleregist-content .normal-list li {
                grid-template-columns: 3rem 5rem 1fr;
            }
            .registlist-content .img-btns {
                display: flex;
                padding: 1rem 0;
            }
            .registlist-content .img-btn {
                /* margin-bottom: .5rem; */
                /* align-items: center; */
                /* width: 3rem; */
                margin-right: 2rem;
                text-align: center;
                justify-items: center;
            }
            .registlist-content .img-btns>.img-btn>span {
                font-size: 60%;
            }
            .registlist-content .img-btn>img {
                padding: .2rem;
                /* width: 2.5rem; */
            }
            .registlist-area {
                padding: 0;
            }
            /* div[name="add-img-btn"] {
                width: 3rem;
            } */
        }
    </style>
</head>

<body>
    <div th:replace="~{fragment/main::main-fragment-nosidebar}"></div>

    <script th:src="@{/js/default.js}"></script>
    <script th:src="@{/js/dialog.js}"></script>
    <script th:src="@{/js/list.js}"></script>
    <script th:src="@{/js/recycle.js}"></script>
    <script type="text/JavaScript" th:inline="JavaScript">
        const updateStateCode = /*[[${updateStateCode}]]*/;
        const createStateCode = /*[[${createStateCode}]]*/;
        const deleteStateCode = /*[[${deleteStateCode}]]*/;
        const token = /*[[${_csrf.token}]]*/;
        const makerlist = /*[[${makerlist}]]*/;
        let list = /*[[${list}]]*/;
        let origin = [];

// 画面操作 ----------------------------------------------------------------------------------------------------------------------------------

            // 製造業者リスト取得
            function getProductlist(code) {
                const items = list?.filter(value => { return value.recycle_maker_code == code });
                if (items == null) return;
                let productlist = [];
                items.forEach(function (item) {
                    let product = {"code":item.code, "number":item.recycle_product_id, "state":item.state, "text":item.recycle_product_name};
                    productlist.push(product);
                });
                return productlist;
            }

            // 保存時の処理
            async function execSaveRecycleRegist() {
                await execSaveRegistListAfterLoadingList("/recycle/product/save", "/list/recycle/product")
            }            

            // リセット時の処理
            function execResetRegistList() {
                startProcessing();

                list = structuredClone(origin);

                const listArea = document.querySelector("[name='registlist-area']");
                if (listArea != null) deleteElements(listArea);
                resetRecycleMakerInputBox();

                processingEnd();
            }

            // メーカー入力ボックス初期化
            function resetRecycleMakerInputBox() {
                const makerCode = document.querySelector("[name='maker-code']");
                if (makerCode != null) makerCode.value = "";
                const makerName = document.querySelector("[name='maker-name']");
                if (makerName != null) makerName.value = "";
            }

            // ドロップした後の処理
            function processingAfterDrop(e) {
                const newListElements = e.target.parentNode.querySelectorAll('li');
                let i = 0;
                newListElements.forEach(function (listElm) {
                    i++;
                    listElm.dataset.code = i;
                    listElm.dataset.state = updateStateCode;
                    let id = listElm.dataset.number;
                    let elm = list.find(function (value) { return value.recycle_product_id == id; });
                    elm.code = i;
                    elm.state = updateStateCode;
                });
            }

            // 仮IDを取得する
            function getRegistListMaxId() {
                return list.length > 0 ? Math.max.apply(null, list.map(function (value) { return value.recycle_product_id; })): 0;
            }

            // listからアイテムを選択する
            function getSelectedItemCategoryRegistFromList(selectId) {
                return list?.find(function (value) { return value.recycle_product == selectId });
            }

            //
            function getMakerCode() {
                const codeElm = document.querySelector('[name="maker-code"]');
                if (codeElm != null) {
                    return codeElm.value;
                } else {
                    return 0;
                }
            }
            // listに追加する
            function addRegistListItemToList() {
                const makerCode = document.querySelector("[name='maker-code']");
                if (makerCode == null) return;
                if (makerCode.value == "") {
                    createMessageDialog("メーカーコードを入力してください", "エラー", "red");
                    return;
                }

                // リストエリアを取得
                const parentElm = document.querySelector('[name="registlist-list"]');
                if (parentElm == null) return;
                const maxId = getRegistListMaxId();
           
                const inputElm = parentElm.querySelector('input');
                if (inputElm == null) return;
                const listItems = parentElm.querySelectorAll('li');
                const product = { "recycle_product_id": (maxId + 1), "code": listItems.length, "recycle_maker_code":makerCode.value, "recycle_product_name": inputElm.value, "state": createStateCode };
                list.push(product);
            }

            // listに追加する
            function updateRegistListItemToList(selectElm) {
                const selectId = selectElm.dataset.number;
                const item = list.find(value => { return value.recycle_product_id == selectId });
                if (item != null) {
                    item.recycle_product_name = selectElm.textContent;
                    item.state = updateStateCode;
                }
            }

            // リストデータ取得
            function getRecycleProductItems(elm) {
                if (elm == null) return;

                const parent = elm.closest('[name="simple-list"]');
                if (parent == null) return;
                const selectElm = parent.querySelector('li.selected');
                if (selectElm == null) return;

                const makerCode = getMakerCode();

                const items = list.filter(value => { return value.recycle_maker_code == makerCode });
                if (items == null) return;

                items.sort((a, b) => a.code > b.code ? 1 : -1);

                let productlist = [];
                items.forEach(function (item) {
                    let product = { "number": item.recycle_product_id, "code": item.code, "state": item.state, "text": item.recycle_product_name };
                    productlist.push(product);
                });
                return productlist;
            }

            function getRewriteAllStatusCodes(id) {
                return list.find(function (value) { return value.recycle_product_id == id; });
            }

            function getMakerNameOnEnter(e) {
                if(e.key === 'Enter'){
                    getMakerName(e.target.value);
                }
            }
            // function getMakerNameOnBlur(e) {
            //     if(e.target.value == "") return;
            //     getMakerName(e.target.value);
            // }
            function getMakerNameOnSearch() {
                const elm = document.querySelector("[name='maker-code']");
                if (elm == null || elm.value == "") return;
                getMakerName(elm.value);
            }
            // メーカーコード入力時、メーカー情報を取得して表示
            async function getMakerName(code) {
                // if(e.key === 'Enter'){
                    // const area = document.querySelector('[name="registlist-area"]');
                    const area = document.querySelector('[name="registlist-list"]');
                    deleteElements(area);
                    const name = document.querySelector('[name="maker-name"]');
                    if (name == null) return;
                    const data = "code=" + encodeURIComponent(code);
                    const url = '/recycle/maker/get';
                    const contentType = 'application/x-www-form-urlencoded';
                    const result = await postFetch(url, data, token, contentType);
                    const maker = await result.json();

                    if (maker != null) {
                        name.value = maker.recycle_maker_name;
                    } else {
                        name.value = "";
                        return;
                    }
                    let productlist = getProductlist(code);
                    productlist.sort((a, b) => a.code > b.code ? 1 : -1);                
                    createRegistList(productlist, area);

                    const parentElm = document.querySelector('[name="recyclelist-header"]');
                    if (parentElm == null) return;
                    const inputElm = parentElm.querySelector('input');
                    if (inputElm == null) return;
                    inputElm.focus();
                // }
            }

            function changeRegistListItem(e) {
                const parent = document.querySelector('[name="registlist-list"]');
                if (parent == null) return;
                // 選択を解除する
                clearAllSelectInList(parent);
                const inputElm = parent.querySelector('input');
                inputElm.value = e.target.textContent;
                e.target.classList.add('selected');
                e.preventDefault();
            }


            // listからアイテムを選択する
            function getSelectedItemRegistList(selectId) {
                return list?.find(function (value) { return value.recycle_product_id == selectId });
            }

            // 削除時の処理
            function deleteRegistListItem(elm) {
                if (elm == null) return;

                const parent = elm.closest('[name="registlist-list"]');
                const selectElm = parent.querySelector('li.selected');
                if (selectElm == null) return;

                // 選択したアイテムを削除
                const selectId = selectElm.dataset.number;
                deleteFullElements(selectElm);

                // listのアイテムステータスコードを変更する
                const item = getSelectedItemRegistList(selectId);
                if (item!= null) item.state = deleteStateCode;

                parent.querySelector('input').value = "";
            }

            // 追加時の処理
            function addRegistListItem(elm) {
                if (elm == null) return;

                const parent = elm.closest('[name="registlist-list"]');
                if (parent == null) return;

                const inputElm = parent.querySelector('input');
                if (inputElm == null) return;
                if (inputElm.value == "") return;
                inputElm.value = checkDuplicatesTextAddAfterNumber(parent);

                // リストにアイテムを追加する
                addRegistListElement(parent);
                // 選択を解除する
                clearAllSelectInList(parent);
            }

            function addRegistListElement(parent) {
                if (parent == null) return;

                const listElm = parent.querySelector('ul');
                if (listElm == null) return;

                const inputElm = parent.querySelector('input');
                const listItems = parent.querySelectorAll('li');
                const maxId = getRegistListMaxId();

                const newElm = document.createElement('li');
                newElm.onclick = e => changeRegistListItem(e);    
                newElm.setAttribute('id', 'registlist-' + (maxId + 1))
                newElm.setAttribute('data-code', listItems.length + 1);
                newElm.setAttribute('data-number', maxId + 1);
                newElm.setAttribute('data-state', updateStateCode);

                newElm.setAttribute('draggable', 'true');
                newElm.addEventListener("dragstart", onDragStart);
                newElm.addEventListener("drop", onDrop);
                newElm.addEventListener("dragover", onDragover);
                newElm.addEventListener("dragenter", onDragenter);
                newElm.addEventListener("dragleave", onDragleave);
                newElm.innerHTML = inputElm.value;
                listElm.insertAdjacentElement('beforeend', newElm);

                // listにアイテムを追加する
                addRegistListItemToList();

                inputElm.value = "";
                inputElm.focus();
            }

            function updateRegistListItem(elm) {
                if (elm == null) return;

                const parent = elm.closest('[name="registlist-list"]');
                // 同じ名前の場合はリネームする
                const result = checkDuplicatesText(parent);
                if (result == false) return;

                const selectElm = parent.querySelector('li.selected');
                if (selectElm == null) return;
                selectElm.dataset.state = updateStateCode;

                const inputElm = parent.querySelector('input');
                selectElm.textContent = inputElm.value;

                const selectId = selectElm.dataset.number;
                selectElm.textContent = inputElm.value;

                // listのアイテムを変更する
                updateRegistListItemToList(selectElm);

                inputElm.value = "";
                inputElm.focus();
            }

            function createRegistListContent() {
                const elm = document.createElement('div');
                // elm.setAttribute('name', 'registlist-list');
                elm.classList.add('registlist-list');

                const labelElm = document.createElement('label');
                labelElm.classList.add('sp-style');
                labelElm.textContent = "製造業社名";

                const inputItem = document.createElement('input');
                inputItem.setAttribute('name', 'registlist-text');
                inputItem.classList.add('normal-input');

                const buttonAddElm = document.createElement('div');
                // buttonAddElm.classList.add('img-btn', 'pc-style');
                buttonAddElm.classList.add('img-btn');
                buttonAddElm.onclick = function () { addRegistListItem(this); }
                const imgAddElm = document.createElement('img');
                imgAddElm.setAttribute('title', '追加');
                imgAddElm.setAttribute('src', '/icons/add.png');
                buttonAddElm.insertAdjacentElement('beforeend', imgAddElm);
                buttonAddElm.insertAdjacentHTML('beforeend', "<span class=\'sp-style\'>追加</span>");

                const buttonSaveElm = document.createElement('div');
                buttonSaveElm.classList.add('img-btn', 'sp-style');
                buttonSaveElm.onclick = function () { execSaveRecycleRegist(this); }
                const imgSaveElm = document.createElement('img');
                imgSaveElm.setAttribute('title', '保存');
                imgSaveElm.setAttribute('src', '/icons/save.png');
                buttonSaveElm.insertAdjacentElement('beforeend', imgSaveElm);
                buttonSaveElm.insertAdjacentHTML('beforeend', "<span class=\'sp-style\'>保存</span>");

                const buttonUpElm = document.createElement('div');
                // buttonUpElm.classList.add('img-btn', 'pc-style');
                buttonUpElm.classList.add('img-btn');
                buttonUpElm.onclick = function () { updateRegistListItem(this); }
                const imgUpElm = document.createElement('img');
                imgUpElm.setAttribute('title', '更新');
                imgUpElm.setAttribute('src', '/icons/update.png');
                buttonUpElm.insertAdjacentElement('beforeend', imgUpElm);
                buttonUpElm.insertAdjacentHTML('beforeend', "<span class=\'sp-style\'>更新</span>");

                const buttonDelElm = document.createElement('div');
                // buttonDelElm.classList.add('img-btn', 'pc-style');
                buttonDelElm.classList.add('img-btn');
                buttonDelElm.onclick = function () { deleteRegistListItem(this) };
                const imgDelElm = document.createElement('img');
                imgDelElm.setAttribute('title', '削除');
                imgDelElm.setAttribute('src', '/icons/dust.png');
                buttonDelElm.insertAdjacentElement('beforeend', imgDelElm);
                buttonDelElm.insertAdjacentHTML('beforeend', "<span class=\'sp-style\'>削除</span>");

                const buttonReElm = document.createElement('div');
                buttonReElm.classList.add('img-btn', 'sp-style');
                buttonReElm.onclick = function () { execResetRegistList(this) };
                const imgReElm = document.createElement('img');
                imgReElm.setAttribute('title', 'リセット');
                imgReElm.setAttribute('src', '/icons/uturn.png');
                buttonReElm.insertAdjacentElement('beforeend', imgReElm);
                buttonReElm.insertAdjacentHTML('beforeend', "<span class=\'sp-style\'>リセット</span>");

                const buttonElms = document.createElement('div');
                // buttonElms.classList.add('img-btns', 'pc-style');
                buttonElms.classList.add('img-btns');
                buttonElms.insertAdjacentElement('beforeend', buttonAddElm);
                buttonElms.insertAdjacentElement('beforeend', buttonSaveElm);                
                buttonElms.insertAdjacentElement('beforeend', buttonUpElm);
                buttonElms.insertAdjacentElement('beforeend', buttonDelElm);
                buttonElms.insertAdjacentElement('beforeend', buttonReElm);

                // const areaElm = document.createElement('div');
                // areaElm.setAttribute('name', 'registlist-area');

                // elm.insertAdjacentElement('beforeend', buttonElms);
                // elm.insertAdjacentElement('beforeend', inputItem);

                // elm.insertAdjacentElement('beforeend', areaElm);

                // const areaElm = document.createElement('div');
                // areaElm.setAttribute('name', 'registlist-area');
                const headerElm = document.createElement('div');
                headerElm.setAttribute('name', 'registlist-header');
                // headerElm.setAttribute('style', 'display: flex;');

                headerElm.insertAdjacentElement('beforeend', labelElm);
                headerElm.insertAdjacentElement('beforeend', inputItem);
                headerElm.insertAdjacentElement('beforeend', buttonElms);
                
                elm.insertAdjacentElement('beforeend', headerElm);
                // elm.insertAdjacentElement('beforeend', areaElm);
                return elm;
            }

// 初期化時の処理 ------------------------------------------------------------------------------------------------------------------------------------
            // 読み込み時の処理
            window.addEventListener("load", () => {
                origin = structuredClone(list);

                // const parentArea = document.getElementById('registlist-header-product');
                // const parentArea = document.querySelector("[name='registlist-area']");
                const parentArea = document.getElementById('registlist-area');
                const listElm = createRegistListContent();
                parentArea.insertAdjacentElement('beforeend', listElm);

                const header = document.getElementById('registlist-header');

                const codeInput = document.createElement('input');
                codeInput.setAttribute('name', 'maker-code');
                codeInput.classList.add('normal-input');
                codeInput.setAttribute('type', 'text');
                codeInput.setAttribute('inputmode', 'numeric');
                codeInput.setAttribute('pattern', '\d*');
                codeInput.setAttribute('maxlength', '3');
                codeInput.onfocus = function() { this.select(); }
                codeInput.addEventListener('keydown', async function (e) { getMakerNameOnEnter(e); })
                // codeInput.addEventListener('blur', async function (e) { getMakerNameOnBlur(e); })

                const nameInput = document.createElement('input');
                nameInput.setAttribute('name', 'maker-name');
                nameInput.classList.add('normal-input');
                nameInput.setAttribute('type', 'text');
                nameInput.disabled = true;

                const searchBtn = document.createElement('div');
                searchBtn.classList.add('img-btn', 'sp-style');
                searchBtn.addEventListener('click', async function () { getMakerNameOnSearch(); })
                const imgSearch = document.createElement('img');
                imgSearch.setAttribute('title', '検索');
                imgSearch.setAttribute('src', '/icons/search.png');
                searchBtn.insertAdjacentElement('beforeend', imgSearch);

                const inputParts = document.createElement('div');
                inputParts.classList.add('recycle-product-maker-input');
                inputParts.insertAdjacentElement('beforeend', codeInput);
                inputParts.insertAdjacentElement('beforeend', searchBtn);
                inputParts.insertAdjacentElement('beforeend', nameInput);
                header.insertAdjacentElement('beforeend', inputParts);

                // 処理が終了したらスピナーを消去する
                processingEnd();
            });

            window.addEventListener('beforeunload', (e) => {
                const check = list.find(value => { return value.state != 0 });
                if (check != null) {
                    const message = '保存されていないデータがあります。ページを離れますか？';
                    e.preventDefault();
                    e.returnValue = message;
                    return message;
                }
            });
            
        </script>
    </div>
</body>

</html>
