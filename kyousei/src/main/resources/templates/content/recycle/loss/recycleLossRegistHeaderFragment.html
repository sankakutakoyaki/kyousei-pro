<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">

<body>
    <!-- 登録画面リスト用ヘッダー -->
    <header th:fragment="regist-header-fragment">

        <div class="recycleregist-inputs" name="recycle-input-area">
            <div class="recycleregist-input">
                <div class="form-dialog-parts">
                    <label>お問合せ管理票番号</label>
                    <input name="recycle-number" class="normal-input" type="text" inputmode="numeric" pattern="\d*" maxlength="15" value="" onfocus="this.select();">
                    <div name="camera-btn" class="img-btn" onclick="execCamera(this)">
                        <img title="追加" src="/icons/camera.png">
                    </div>
                    <!-- <div name="add-img-btn" class="img-btn sp-style" onclick="execAddRecycleRegist()">
                        <img title="追加" src="/icons/add.png">
                    </div> -->
                </div>
                <div name="add-img-btn" class="img-btn sp-style" onclick="execAddRecycleRegist()">
                    <img title="追加" src="/icons/add.png">
                </div>

                <div class="form-dialog-parts sp-style">
                    <div class="img-btn" onclick="execSaveRecycleRegist()">
                        <img title="保存" src="/icons/save.png"><span>保存</span>
                    </div>
                    <div class="img-btn" onclick="execDeleteRecycleRegist()">
                        <img title="削除" src="/icons/dust.png"><span>削除</span>
                    </div>
                    <div class="img-btn" onclick="execResetRecycleRegist()">
                        <img title="リセット" src="/icons/uturn.png"><span>リセット</span>
                    </div>
                </div>

                <button name="add-btn" class="normal-btn pc-style" type="button" onclick="execAddRecycleRegist()">                        
                    <span>追加</span>
                </button>

                <div></div>

                <!-- 保存ボタン -->
                <button name="save-btn" class="normal-btn ok pc-style" type="button" onclick="execSaveRecycleRegist()">
                    <span>保存</span>
                </button>
                <!-- 削除ボタン -->
                <button name="delete-btn" class="normal-btn pc-style" type="button" onclick="execDeleteRecycleRegist()">
                    <span>削除</span>
                </button>
                <!-- リセットボタン -->
                <button name="reset-btn" class="normal-btn pc-style" type="button" onclick="execResetRecycleRegist()">
                    <span>リセット</span>
                </button>

            </div>
        </div>

    </header>

</body>

</html>
