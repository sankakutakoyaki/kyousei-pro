            <div class="recycleregist-input">
                <div class="form-dialog-parts">
                    <label>お問合せ管理票番号</label>
                    <input name="recycle-number" class="normal-input" type="text" inputmode="numeric" pattern="\d*" maxlength="15" value="" onfocus="this.select();">
                    <div name="camera-btn" class="img-btn" onclick="execCamera(this)">
                        <img title="追加" src="/icons/camera.png">
                    </div>
                </div>
                <button name="number-search-btn" class="normal-btn ok" type="button" onclick="execSearchRecycleNumber()">                        
                    <span>検索</span>
                </button>

                <!-- CSVボタン -->
                <button name="csv-btn" class="normal-btn pc-style" type="button" onclick="execDownloadRecycleList()">
                    <span>CSV</span>
                </button>
                <!-- 削除ボタン -->
                <button name="delete-btn" class="normal-btn pc-style" type="button" onclick="execDeleteRecycleList()">
                    <span>削除</span>
                </button>
                <!-- リセットボタン -->
                <!-- <button name="reset-btn" class="normal-btn" type="button" onclick="execResetRecycleList()">
                    <span>リセット</span>
                </button> -->
                <!-- 修正ボタン -->
                <button sec:authorize="hasAuthority('APPROLE_admin')" name="update-btn" class="normal-btn pc-style" type="button" onclick="execUpdateRecycleList()">

                </button>
                <div></div>
