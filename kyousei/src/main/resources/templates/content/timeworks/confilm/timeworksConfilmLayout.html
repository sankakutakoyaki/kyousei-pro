        // 入力チェック
        function execFormDataCheck() {
            let msg = "";
            
            const start = document.querySelector('[name="start_time"]');
            if (start == null || start.value == "") {
                msg += '\n出勤時刻が入力されていません';
            }

            const end = document.querySelector('[name="end_time"]');
            if (end == null || end.value == "") {
                msg += '\n退勤時刻が入力されていません';
            }

            const startNum = parseTimeToNum(start.value);
            const endNum = parseTimeToNum(end.value);
            if (startNum > 0 && endNum > 0 && endNum - startNum < 0) {
                msg += '\n出勤時刻より退勤時刻が早くなっています';
            }

            const hourlyWage = document.querySelector('[name="hourly_wage"]');
            if (hourlyWage == null || hourlyWage.value == 0) {
                msg += '\n時給が入力されていません';
            }

            if (msg != "") {
                const title = 'エラー';
                const headerColor = 'red';
                createMessageDialog(msg, title, headerColor);
                return false;
            }
            return true;
        }

        // 作成・更新処理
        async function execUpdateFormData() {
            if (execFormDataCheck() == false) {
                return;
            } else {
                const form = document.getElementById('timeworks-form');
                const formData = new FormData(form);
                const formdata = {};
                
                // 日付
                const workDate = formData.get('work_date');
                formdata.work_date = workDate;
                // 曜日
                const dayOfWeek = getDayOfWeekAsSingle(workDate);
                formdata.day_of_week = dayOfWeek;
                // 時給
                const hourlyWage = formData.get('hourly_wage');
                formdata.hourly_wage = parseInt(hourlyWage);
                // 出勤
                const start = formData.get('start_time');
                formdata.comp_start_time = (start == null || start == "") ? "0:00": parseTimeToStr(parseTimeToNum(start));
                // 退勤
                const end = formData.get('end_time');
                formdata.comp_end_time = (end == null || end == "") ? "0:00": parseTimeToStr(parseTimeToNum(end));
                // 出勤(定時)
                const startRegularHours = formData.get('start_regular_hours');
                formdata.start_regular_hours = (startRegularHours == null || startRegularHours == "") ? "0:00": parseTimeToStr(parseTimeToNum(startRegularHours));
                // 退勤(定時)
                const endRegularHours = formData.get('end_regular_hours');
                formdata.end_regular_hours = (endRegularHours == null || endRegularHours == "") ? "0:00": parseTimeToStr(parseTimeToNum(endRegularHours));
                // 休憩
                const breakeStr = formData.get('breake_time');
                formdata.breake_time = (breakeStr == null || breakeStr == "") ? "0:00": parseTimeToStr(parseTimeToNum(breakeStr));
                // 勤務時間
                const workTimeStr = resultSubtractingTime(start, end);
                formdata.work_time = workTimeStr;

                const workTimeNum = parseTimeToNum(workTimeStr);
                formdata.work_time_num = workTimeNum;
                const breakeNum = parseTimeToNum(breakeStr);
                formdata.breake_time_num = breakeNum;

                // 実働時間単位
                const realWorkTimeNum = Math.ceil((workTimeNum - breakeNum) * 100) / 100;
                formdata.real_work_time_unit = realWorkTimeNum;
                // 実働時間
                const realWorkTimeStr = parseTimeToStr(realWorkTimeNum);
                formdata.real_work_time = realWorkTimeStr;
                // formdata.real_work_time = (realWorkTimeStr == null || realWorkTimeStr == "") ? "0:00": parseTimeToStr(parseTimeToNum(realWorkTimeStr));
                // 時間外時間単位
                const overtime = (realWorkTimeNum - 8) < 0 ? 0: realWorkTimeNum - 8;
                const overtimeNum = Math.ceil(overtime * 100) / 100;
                formdata.overtime_unit = overtimeNum;
                // 時間外
                const overtimeStr = parseTimeToStr(overtimeNum);
                formdata.overtime = overtimeStr;

                const startNightTime = parseTimeToNum("22:00");
                const endNum = parseTimeToNum(end);

                // 深夜時間単位
                const nighttime = endNum - startNightTime <= 0 ? 0: endNum - startNightTime;
                const nighttimeNum = Math.ceil(nighttime * 100) / 100;
                formdata.nighttime_unit = nighttimeNum;
                // 深夜時間
                const nighttimeStr = parseTimeToStr(nighttimeNum);
                formdata.nighttime = nighttimeStr;
                // 実働基本給
                const realtimePay = Math.ceil(realWorkTimeNum * hourlyWage);
                formdata.realtime_pay = realtimePay;
                // 時間外手当
                const overtimePay = Math.ceil((overtimeNum * hourlyWage) * 0.25);
                formdata.overtime_pay = overtimePay;
                // 深夜手当
                const nighttimePay = Math.ceil((nighttimeNum * hourlyWage) * 0.25);
                formdata.nighttime_pay = nighttimePay;
                // 総額
                const totalAmount = Math.ceil(realtimePay + overtimePay + nighttimePay);
                formdata.total_amount = totalAmount;
                // 源泉
                const tax = taxlist?.find(value => { return value.start_pay <= totalAmount && totalAmount  <= value.end_pay });
                const withholdingTax = (tax == null || tax == "") ? 0 : tax.withholding_tax;
                formdata.wiholding_tax = withholdingTax;
                // 非課税交通費
                const transcost = formData.get('trans_cost');
                const transCost = Math.ceil((transcost == null || transcost == "") ? 0: parseInt(transcost));
                formdata.trans_cost = transCost;
                // 支給額
                const payment = Math.ceil(totalAmount - withholdingTax + transCost);
                formdata.payment = payment;                

                formdata.timeworks_payment_id = parseInt(formData.get('timeworks_payment_id'));
                formdata.timeworks_id = parseInt(formData.get('timeworks_id'));
                formdata.full_name = formData.get('full_name');
                formdata.full_address = formData.get('full_address');
                // formdata.print_state = notPrintStateCode;
                formdata.pay_state = notPayStateCode;
                formdata.state = completeStateCode;
                formdata.version = parseInt(formData.get('version'));
                closeDialog('form-dialog-area');

                // 保存処理
                const url = "/timeworks/payment/parttime";
                const data = JSON.stringify(formdata);
                const contentType = 'application/json';
                const resultResponse = await postFetch(url, data, token, contentType);
                const result = await resultResponse.json();
                if (result == false) {
                    // 失敗のダイアログを表示する
                    failureDialog();
                } else {
                    // 画面更新
                    await updateTableList();
                }
            }
        }

                entity.comp_start_time = date.value + " " + start.value + ":00.0000000";
            } else {
                entity.comp_start_time = date.value + " 00:00:0.0000000";
            }
            if (end.value != "") {
                entity.comp_end_time = date.value + " " + end.value + ":00.0000000";
            } else {
                entity.comp_end_time = date.value + " 00:00:0.0000000";
            }
            entity.start_latitude = position.coords.latitude;
            entity.start_longitude = position.coords.longitude;
            entity.time_category = "start";
            const data = JSON.stringify(entity);
            const url = '/timeworks/create/today';
            const contentType = 'application/json';
            const result = await postFetch(url, data, token, contentType);
            closeDialog('form-dialog-area');
            await updateTableList();

            processingEnd();
            // btn.disabled = false;
        }

        // 入力チェック
        function execNewFormDataCheck() {
            let msg = "";

            const code = document.getElementById('new_code');
            const name = document.getElementById('new_name');
            if (code == null || code.value == "" || code.value == "0" || name == null || name.value == "") {
                msg += '\nコードが入力されていません';
            }

            const date = document.getElementById('new_work_date');
            if (date == null || date.value == "") {
                msg += '\n出勤日が入力されていません';
            }

            const today = new Date().toLocaleDateString('sv-SE');
            if (date.value > today) {
                msg += '\n未来の日付が入力されています';
            }

            if (msg != "") {
                const title = 'エラー';
                const headerColor = 'red';
                createMessageDialog(msg, title, headerColor);
                return false;
            }
            return true;
        }

        // コードから[employee]を取得して、名前を表示
        async function searchForNameByCode(e, isReset) {
            e.preventDefault();
            // ✖️ボタン(isReset=true)が押されたら入力されているテキストを消去する
            if (isReset) {
                setItems();
                return; 
            }

            // [id=code]に入力されたコードから[employee]を取得して[id=name]に入力する
            const code = document.getElementById('new_code');
            const data = "code=" + encodeURIComponent(code.value);
            const url = '/personnel/get/code';
            const contentType = 'application/x-www-form-urlencoded';
            // [employee]を取得
            const result = await postFetch(url, data, token, contentType);
            const ent = await result.json();
            if (ent != null && ent.employee_id > 0 && ent.category_id == categoryid) {
                setItems(ent);
                return;
            } else if (ent.employee_id > 0 && ent.category_id != categoryid) {
                const msg = "アルバイトデータが見つかりません"
                const title = 'エラー';
                const headerColor = 'red';
                createMessageDialog(msg, title, headerColor);
                setItems();
                return;
            } else {
                const msg = "コードが登録されていません"
                const title = 'エラー';
                const headerColor = 'red';
                createMessageDialog(msg, title, headerColor);
                setItems();
                return;
            }
        }
        // リセットの場合は引数を[null]にする
        function setItems(ent) {
            const code = document.getElementById('new_code');
            const name = document.getElementById('new_name');
            const empid = document.getElementById('new_employee_id');
            if (code == null || name == null || empid == null) { return; }

            if (ent == null) {
                empid.value = "";
                code.value = "";
                name.value = "";
            } else {
                empid.value = ent.employee_id;
                name.value = ent.full_name;
            }
            return;
        }

        async function checkTimeWorks() {
            const empid = document.getElementById('new_employee_id');
            const date = document.getElementById('new_work_date');
            const empdata = { "number": parseInt(empid.value), "text": date.value };
            const data = JSON.stringify(empdata);
            const url = '/timeworks/check/employee';
            const contentType = 'application/json';
            const result = await postFetch(url, data, token, contentType);
            return await result.json();
        }

// -------------------------------------------------------------------------------------------------------------------------------------- 削除
        async function execDelete(self) {
            // 削除用のSQL文を取得する（選択されていなければ[NULL]が返る）
            const parent = self.closest('.tablelist-container');
            const ids = getAllSelectedCheckboxes(parent);
            let str = " IN (";
            const deleteStr = getSqlStringFromSearchCriteriaByIds(ids, str);
            if (deleteStr == null) {
                notSelectedDialog();
                return false;
            }
            ids.forEach(elm => {
                let item = list?.find(value => { return value.timeworks_id == elm.id && value.state == completeStateCode });
                if (item != null) {
                    const msg = "確定済みのデータは削除できません"
                    const title = 'エラー';
                    const headerColor = 'red';
                    createMessageDialog(msg, title, headerColor);
                    return;
                }
            });

            const sqlStr = "UPDATE tw SET tw.state = " + deleteStateCode + " FROM timeworks tw WHERE tw.timeworks_id " + deleteStr + ";";
            // const data = "str=" + encodeURIComponent(sqlStr);console.log(data)
            const deletesqldata = { "sqlString": sqlStr };
            const data = JSON.stringify(deletesqldata);
            const url = "/timeworks/delete";
            // const contentType = 'application/x-www-form-urlencoded';
            const contentType = 'application/json';
            const resultResponse = await postFetch(url, data, token, contentType);
            const result = await resultResponse.json();

            if (result == false) {
                // 失敗のダイアログを表示する
                failureDialog();
            } else {
                // 画面更新
                await updateTableList();
            }
        }

// -------------------------------------------------------------------------------------------------------------------------------------- 画面更新
        // 指定した条件で検索する
        async function execSearch() {
            await updateTableList();
        }

        // テーブルリストデータを再取得・表示する
        async function updateTableList() {
            startProcessing();

            const start = document.querySelector("[name='startdate']");
            if (start == null) return;
            const end = document.querySelector("[name='enddate']");
            if (end == null) return;

            const url = "/tablelist/update";
            const sql = {"sqlString":sqldata.sqlString + " AND tw.work_date BETWEEN '" + start.value + "' AND '" + end.value + "' ORDER BY tw.work_date", "classPath":sqldata.classPath}
            const data = JSON.stringify(sql);
            const contentType = 'application/json';
            const result = await postFetch(url, data, token, contentType);
            tablelist = await result.json();
            list = structuredClone(tablelist);

            let selectId = 0;
            let emp = document.querySelector("[name='employee-select']");
            if (emp != null) {
                selectId = emp.value;
            }
            createEmployeeList();
            emp = document.querySelector("[name='employee-select']");
            emp.value = selectId;
            // createStateList();

            changeTimeworksList();
            createTimeworksTalble();

            processingEnd();
        }

        // 画面更新時に従業員・確定状況リストの選択によってフィルターをかける
        function changeTimeworksList() {
            const emp = document.querySelector("[name='employee-select']");
            if (emp == null) return;
            const state = document.querySelector("[name='state-select']");
            if (state == null) return;

            if (emp.value == 0 && state.value == 0) {
                list = structuredClone(tablelist);
            } else if (emp.value > 0 && state.value == 0) {
                list = tablelist?.filter(value => { return value.employee_id == emp.value });
            } else if (emp.value == 0 && state.value > 0) {
                list = tablelist?.filter(value => { return value.state == state.value });
            } else if (emp.value > 0 && state.value > 0) {
                list = tablelist?.filter(value => { return value.employee_id == emp.value && value.state == state.value });
            }
            createTimeworksTalble();
        }

        // 画面を再描画する
        function createTimeworksTalble() {
            const tbl = document.getElementById('tablelist-timeworks');
            deleteElements(tbl);
            createTableListHeader(tbl, tablelistHeaderNames);
            createTableListContent(tbl, list);
        }

// -------------------------------------------------------------------------------------------------------------------------------------- 初期化時の処理
        window.addEventListener("load", async () => {

            list = structuredClone(tablelist);
            createEmployeeList();
            createStateList();
            // const combo = document.querySelector("[name='state-select']");
            // const options = combo.options;
            // if (options != null) options[1].selected = true;
            // フッター表示用の取得時刻を設定
            acquisitionDateTime = getNow();
            // リストのフィルター処理
            changeTimeworksList();
            // 画面作成
            createTimeworksTalble();
            // 日付が変更された時の処理を登録
            document.querySelector('[name="startdate"]').addEventListener("change", (e) => { checkStartDateChanged(e, "enddate") });
            document.querySelector('[name="enddate"]').addEventListener("change", (e) => { checkEndDateChanged(e, "startdate") });
            // セレクトボックスの値が変更された時の処理を登録
            document.querySelector('[name="employee-select"]').addEventListener("change", () => { changeTimeworksList() });
            document.querySelector('[name="state-select"]').addEventListener("change", () => { changeTimeworksList() });
            // 日付ボックスを設定
            execSpecifyPeriod('this-month');
            // 処理が終了したらスピナーを消去する
            processingEnd();
        });
    </script>
