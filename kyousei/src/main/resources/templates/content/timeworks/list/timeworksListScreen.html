<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div class="tablelist-container timeworks list" th:fragment="timeworks-screen(breadcrumbs)">
        <!-- パンくずリスト -->
        <div layout:replace="~{fragment/breadcrumbFragment::title(${breadcrumbs})}"></div>
        <!-- ヘッダー -->
        <header th:replace="~{content/timeworks/list/timeworksListHeaderFragment::header-fragment}"></header>
        <!-- コンテンツ -->
        <main id="scroll-area">
            <form id="scroll-element">
                <table id="tablelist-timeworks" class="normal-table">
                    <tbody></tbody>
                </table>
                <button type="button" class="page-top"></button>
            </form>
            <div id="loading">
                <div class="spinner"></div>
            </div>
        </main>
        <!-- フッター -->
        <footer id="footer-text" class="pc-style"><span></span></footer>
    </div>
</body>

</html>
