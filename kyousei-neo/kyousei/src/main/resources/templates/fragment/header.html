<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">

<body>
    <!-- ヘッダーボタン -->
    <div class="kebab-parts" th:fragment="header-btns-fragment">
        <!-- ケバブボタン -->
        <div id="kebab-btn" class="img-btn sp-style" onclick="openKebabDialog(this)"><img title="メニュー" th:src="@{/icons/kebab_menu.png}"></div>
        <div class="img-btns kebab">
            <!-- 新規作成ボタン -->
            <div class="img-btn" onclick="createFunc(this)"><img title="作成・登録" src="/icons/add.png"><span>新規</span></div>
            <!-- 削除ボタン -->
            <div class="img-btn" onclick="removeFunc(this)"><img title="削除" src="/icons/dust.png"><span>削除</span></div>
            <!-- ダウンロードボタン -->
            <div class="img-btn" onclick="downloadCsvFunc(this)"><img title="ダウンロード" src="/icons/download.png"><span>取得</span></div>
            <!-- 更新ボタン -->
            <!-- <div class="img-btn" onclick="updateFunc(this)"><img title="更新" src="/icons/update.png"><span>更新</span></div> -->
            <!-- 閉じるボタン -->
            <div class="img-btn sp-style" onclick="closeKebabDialog(this)"><img title="閉じる" src="/icons/close-b.png"><span>閉じる</span></div>
        </div>
    </div>
    <div class="kebab-parts" th:fragment="header-btns-recycle-fragment">
        <!-- ケバブボタン -->
        <div id="kebab-btn" class="img-btn sp-style" onclick="openKebabDialog(this)"><img title="メニュー" th:src="@{/icons/kebab_menu.png}"></div>
        <div class="img-btns kebab">
            <!-- 編集ボタン -->
            <div class="img-btn" onclick="execEdit()"><img title="編集" src="/icons/edit.png"><span>編集</span></div>
            <!-- 削除ボタン -->
            <div class="img-btn" onclick="execDelete()"><img title="削除" src="/icons/dust.png"><span>削除</span></div>
            <!-- ダウンロードボタン -->
            <div class="img-btn" onclick="execDownload()"><img title="ダウンロード" src="/icons/download.png"><span>取得</span></div>
            <!-- 閉じるボタン -->
            <div class="img-btn sp-style" onclick="closeKebabDialog(this)"><img title="閉じる" src="/icons/close-b.png"><span>閉じる</span></div>
        </div>
    </div>
    <div class="kebab-parts" th:fragment="header-btns-cash-expenses-fragment">
        <!-- ケバブボタン -->
        <div id="kebab-btn" class="img-btn sp-style" onclick="openKebabDialog(this)"><img title="メニュー" th:src="@{/icons/kebab_menu.png}"></div>
        <div class="img-btns kebab">
            <!-- 新規作成ボタン -->
            <div class="img-btn" onclick="createFunc(this)"><img title="作成" src="/icons/add.png"><span>新規</span></div>
            <!-- 削除ボタン -->
            <div class="img-btn" onclick="execDelete(this)"><img title="削除" src="/icons/dust.png"><span>削除</span></div>
            <!-- ダウンロードボタン -->
            <div class="img-btn" onclick="execDownload()"><img title="ダウンロード" src="/icons/download.png"><span>取得</span></div>
            <!-- 閉じるボタン -->
            <div class="img-btn sp-style" onclick="closeKebabDialog(this)"><img title="閉じる" src="/icons/close-b.png"><span>閉じる</span></div>
        </div>
    </div>

    <!-- 検索ボックス -->
    <div th:fragment="header-search-fragment" class="search-box w100">
        <input id="search-box" type="search" placeholder="検索">
        <img title="検索" src="/icons/search.png" onclick="filterDisplay()">
    </div>


    <!-- 日付移動ボタン -->
    <div th:fragment="header-month-move-btn-fragment"  class="input-area">
        <button name="prev-month-btn" class="normal-btn frameless" type="button" onclick="execSpecifyPeriod('prev-month')">
            <span>前月</span>
        </button>
        <button name="this-month-btn" class="normal-btn frameless" type="button" onclick="execSpecifyPeriod('this-month')">
            <span>今月</span>
        </button>
        <button name="next-month-btn" class="normal-btn frameless" type="button" onclick="execSpecifyPeriod('next-month')">
            <span>次月</span>
        </button>
    </div>
    <!-- 日付移動ボタン -->
    <div th:fragment="header-day-move-btn-fragment" class="input-area">
        <button name="prev-day-btn" class="normal-btn frameless" type="button" onclick="execSpecifyPeriod('prev-day')">
            <span>前日</span>
        </button>
        <button name="today-btn" class="normal-btn frameless" type="button" onclick="execSpecifyPeriod('today')">
            <span>今日</span>
        </button>
        <button name="next-day-btn" class="normal-btn frameless" type="button" onclick="execSpecifyPeriod('next-day')">
            <span>翌日</span>
        </button>
    </div>
    <!-- 日付移動ボタン -->
    <div th:fragment="header-week-move-btn-fragment" class="input-area">
        <button name="prev-week-btn" class="normal-btn frameless" type="button" onclick="execSpecifyPeriod('prev-week')">
            <span>前週</span>
        </button>
        <button name="this-week-btn" class="normal-btn frameless" type="button" onclick="execSpecifyPeriod('this-week')">
            <span>今週</span>
        </button>
        <button name="next-week-btn" class="normal-btn frameless" type="button" onclick="execSpecifyPeriod('next-week')">
            <span>次週</span>
        </button>
    </div>


</body>

</html>
