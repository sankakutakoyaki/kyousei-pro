<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/tablelist-noside}">

<head>
    <title>リサイクルロス処理</title>
    <style type="text/css">
        .table-container {
            max-width: 45rem;
        }
        .normal-table tr {
            grid-template-columns: 1rem 10rem 7rem 1fr 1rem;
        }
        @media screen and (max-width:1240px) {}

        @media screen and (max-width:560px) {
            .table-container {
                max-width: 100%;
            }
            .normal-table tr {
                grid-template-columns: 1fr;
                height: fit-content;
                padding: 1.5rem;
            }
            .normal-table tr td[name="recycle-number"]::before {
                content: "番号 : ";
            }
            .normal-table tr td[name="loss-reason"]::before {
                content: "理由 : ";
            }
            .normal-table tr td[name="loss-comment"]::before {
                content: "コメント : ";
            }
        }
    </style>
</head>

<body layout:fragment="layout-body">
    <div class="normal-body">
        <div class="table-container">
            <!-- パンくずリスト -->
            <div
                th:with="breadcrumbs=${ { {url:'/' ,label:'ホーム'},{url:'/recycle', label:'リサイクル'},{url:'', label:'ロス処理'} } }">
                <div th:replace="~{fragment/main::breadcrumb-fragment(${breadcrumbs})}"></div>
            </div>
            <!-- ヘッダー -->
            <header class="input-area w100">
                <div class="form-parts w40">
                    <label>理由</label>
                    <select id="loss-reason" name="loss-reason" class="normal-select"></select>
                </div>
                <div class="form-parts w100">
                    <label>コメント</label>
                    <input name="loss-comment" type="text" class="normal-input">
                </div>
                <div class="input-area">
                    <div class="form-parts"><label>お問合せ管理票番号</label>
                        <div class="input-area">
                            <div class="form-parts">
                                <input autofocus name="recycle-number" class="normal-input recycle-number" type="text" inputmode="numeric" pattern="\d*" maxlength="15" value="" onfocus="this.select();">
                                <div name="camera-btn" class="img-btn" onclick="execCamera(this)"><img title="追加" src="/icons/camera.png"></div>
                            </div>
                            <div class="form-parts">
                                <button name="add-btn" class="normal-btn ok" type="button" onclick="execAddRecycleRegist()"><span>追加</span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
            <!-- コンテンツ -->
            <main id="scroll-area">
                <table id="tablelist" class="normal-table">
                    <tbody></tbody>
                </table>
                <button type="button" class="page-top"></button>
            </main>
            <!-- フッター -->
            <footer id="footer-text" class="pc-style"><span></span></footer>
        </div>
    </div>

    <script th:src="@{/js/default.js}"></script>
    <script th:src="@{/js/tablelist.js}"></script>
    <script th:src="@{/js/recycle.js}"></script>
    <script type="text/javascript" src="https://serratus.github.io/quaggaJS/examples/js/quagga.min.js"></script>
    <script type="text/JavaScript" th:inline="JavaScript">
        const token = /*[[${_csrf.token}]]*/;
        // const sqldata = /*[[${sqldata}]]*/; // リスト再取得用エンティティ
        // let origin = /*[[${origin}]]*/;
        let list = [];
        const headerNames = ['', 'お問合せ管理票番号', '理由', 'コメント'];
        const username = /*[[${username}]]*/;
        
// ----------------------------------------------------------------------------------------------------------------------------------
        // テーブルリストのコンテント画面を作成する
        function createListContent(tbl, list) {
            list.forEach(function (item) {
                let newRow = tbl.insertRow();
                // ID（Post送信用）
                newRow.setAttribute('id', 'row00-' + item.recycle_id);
                newRow.setAttribute('name', 'data-row');
                newRow.setAttribute('data-id', item.recycle_id);
                // 調整用セル
                newRow.insertCell();
                // リサイクル券番号
                newRow.insertAdjacentHTML('beforeend', '<td name="recycle-number"><span>' + item.recycle_number + '</span></td>');
                // 理由
                newRow.insertAdjacentHTML('beforeend', '<td name="loss-reason"><span>' + item.loss_reason + '</span></td>');
                // コメント
                newRow.insertAdjacentHTML('beforeend', '<td name="loss-comment"><span>' + item.loss_comment + '</span></td>');
            });
        }
        // 入力内容に間違いがないかチェックする
        function execFormDataCheck() {
            let msg = "";
            // リサイクル券番号チェック
            const number = document.querySelector("[name='recycle-number']");
            if (number.value == "") msg += '\nリサイクル券番号が入力されていません';
            // エラーが一つ以上あればエラーメッセージダイアログを表示する
            if (msg != "") {
                messageDialog(msg, 'エラー', 'red');
                return false;
            }
            return true;
        }
        // 登録する
        function execAddRecycleRegist() {
            if (execFormDataCheck() == false) {
                const elm = document.querySelector('input[name="recycle-number"]');
                if (elm != null) elm.focus();
                return;
            } else {
                const formdata = {};
                const select = document.getElementById('loss-reason');
                formdata.loss_reason = select?.options[select.selectedIndex].text;
                formdata.loss_comment = document.querySelector('input[name="loss-comment"]')?.value;
                formdata.recycle_number = document.querySelector('input[name="recycle-number"]')?.value;
                formdata.user_name = username;
                updateRecycle(formdata, "/create/recycle/loss");
            }
        }
        // リサイクル券番号入力ボックスからフォーカスが外れた時の処理
        function execRecycleNumberBlur(e) {
            if (e.target.value == "") {
                const number = document.querySelector('input[name="recycle-number"]');
                number.value = "";
                return;
            }
            checkRecycleNumber(e.target);
        }
        // リサイクル券番号入力ボックスでエンターを押した時の処理
        function execRecycleNumberChanged(e) {
            // ボックスが空白なら処理しない
            if (e.target.value == "") return;
            if(e.key === 'Enter'){
                e.preventDefault();
                const number = document.querySelector('input[name="recycle-number"]');
                if (number == null) return;
                // 番号が正しいかチェック
                checkRecycleNumber(number);
                if (number.value != "") {
                    execAddRecycleRegist()
                }
            }
        }
        // リサイクル券番号を登録する
        async function updateRecycle(formdata, url) {
            // スピナー表示
            startProcessing();
            // 保存処理
            const data = JSON.stringify(formdata);
            const resultResponse = await postFetch(url, data, token, 'application/json');
            const result = await resultResponse.json();
            if (result == 0) {
                messageDialog("登録できませんでした", 'エラー', 'red');
            } else {
                // 画面更新
                updateRecycleList(formdata);
            }
            // スピナー消去
            processingEnd();
        }
        // 画面更新
        function updateRecycleList(formdata) {
            // スピナー表示
            startProcessing();

            list.push(formdata);
            updateListDisplay("tablelist", headerNames, list, "footer-text", false);
            const number = document.querySelector('input[name="recycle-number"]');
            if (number == null) return;
            const comment = document.querySelector('input[name="loss-comment"]');
            if (comment == null) return;
            number.value = "";
            comment.value = "";
            number.focus();
            // スピナー消去
            processingEnd();
        }

// 初期化時の処理 ------------------------------------------------------------------------------------------------------------------------------------
        // 読み込み時の処理
        window.addEventListener("load", async () => {
            // サイドバーを作成する
            const parents = getParentlist();
            const childlist = getChildlist();
            createAccordionSidebar(parents, childlist);
            // 理由コンボボックスを作成する
            const reasonArea = document.getElementById('loss-reason');
            const reasonlist = [{"number":1, "text":"書き損じ"}, {"number":2, "text":"紛失・盗難"}, {"number":3, "text":"その他"}];
            createComboBox(reasonArea, reasonlist);
            // リサイクル券番号入力ボックスでエンターキーが押された時の処理を登録
            document.querySelector('input[name="recycle-number"]').addEventListener('keydown', function (e) { execRecycleNumberChanged(e); });
            // リサイクル券番号入力ボックスのフォーカスが外れた時の処理を登録
            document.querySelector('input[name="recycle-number"]').addEventListener('blur', function (e) { execRecycleNumberBlur(e); });
            // 画面更新
            updateListDisplay("tablelist", headerNames, list, "footer-text", false);
            // 処理が終了したらスピナーを消去する
            processingEnd();
        });
    </script>
</body>

</html>
